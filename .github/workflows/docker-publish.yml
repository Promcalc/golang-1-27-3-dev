name: Build and Push Docker Image

on:
  push:
    tags:
      - 'v*.*.*' # Срабатывает только при пуше тега вида v1.2.3

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/golang-dev-image-1273
          tags: |
            type=semver,pattern={{version}}          # v1.2.3  -> 1.2.3
            type=semver,pattern={{major}}.{{minor}}  # v1.2.3  -> 1.2
            type=raw,value=latest                    # v1.2.3  -> latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}